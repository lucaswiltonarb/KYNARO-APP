# Bicep Curl Exercise Definition
name: bicep_curl
display_name: "Bicep Curl"
type: repetition
bilateral: true

# Meta bilgiler
target_muscles:
  - Biceps
  - Brachialis
equipment: "Dumbbells"
difficulty: beginner
default_reps: 10
default_sets: 3
rest_time: "60 seconds"
benefits:
  - "Builds bicep strength"
  - "Improves arm definition"
description: "Classic bicep curl with controlled tempo"

# Açı tanımları
# bilateral: o motor procura os ângulos pelas chaves "left" e "right"
angles:
  left:
    points: [left_shoulder, left_elbow, left_wrist]
    description: "Sol kol dirsek açısı"

  right:
    points: [right_shoulder, right_elbow, right_wrist]
    description: "Sağ kol dirsek açısı"

# Durum makinesi
state_order:
  - flex
  - curl
  - down

# calibrado com rosca concentrada real: fecha entre 32-57° e abre entre 133-148°
states:
  down:
    condition: "angle > 120"
    description: "Kol düz - başlangıç pozisyonu"

  curl:
    condition: "angle > 65 and angle <= 120"
    description: "Kaldırma aşaması"

  flex:
    condition: "angle <= 65"
    description: "En üst nokta - sayaç artırılır"

# Sayaç kuralı
counter:
  trigger_state: flex
  from_state: curl
  reset_state: down  # precisa estender o braço antes de contar a próxima

# Zaman filtresi
min_rep_duration: 0.8

# Form geri bildirimleri
feedback: {}

# Kalibrasyon
calibration:
  enabled: true
  reps: 2

# Görselleştirme
visualization:
  lines:
    - points: [left_shoulder, left_elbow]
      color: [0, 0, 255]
      thickness: 4
    - points: [left_elbow, left_wrist]
      color: [0, 0, 255]
      thickness: 4
