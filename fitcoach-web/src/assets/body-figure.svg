<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 450" width="200" height="450" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Silhueta corporal humana muscular</title>
  <desc id="desc">Silhueta frontal de um corpo humano com musculatura visível e pontos de medida no peito, cintura, quadril, braços, coxas e panturrilha.</desc>

  <defs>
