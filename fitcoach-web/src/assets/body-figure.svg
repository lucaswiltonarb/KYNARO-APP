      <stop offset="1" stop-color="#FF6A00" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="muscleStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF6A00" stop-opacity="0.9" />
      <stop offset="1" stop-color="#FF6A00" stop-opacity="0.35" />
    </linearGradient>

    <g id="musclesLeft" stroke="url(#muscleStroke)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round">
